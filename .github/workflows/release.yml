name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build single-file EXE
        shell: pwsh
        run: ./build.ps1 -Python python
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yxmys-imprint-assistant-windows
          path: release/*.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = Get-ChildItem release/*.exe | Select-Object -First 1
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --generate-notes --title $tag
          }

