name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-build.lock
      - name: Build single-file EXE
        shell: pwsh
        run: ./build.ps1 -Python python
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yxmys-imprint-assistant-windows
          path: |
            release/*.exe
            release/release-info.json
          if-no-files-found: error
      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/stage/self-test.json
            build/work/**/warn-*.txt
            src/logs/*.log
            logs/*.log
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $manifest = Get-Content release/release-info.json -Raw | ConvertFrom-Json
          if ($tag -ne "v$($manifest.version)" -or -not $manifest.selfTest.success) {
            throw 'Release tag/version mismatch or failed self-test.'
          }
          $asset = Get-Item "release/yxmys-imprint-assistant-$tag.exe"
          if ((Get-FileHash $asset.FullName -Algorithm SHA256).Hash -ne $manifest.sha256) {
            throw 'Release EXE hash mismatch.'
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName release/release-info.json --clobber
          } else {
            gh release create $tag $asset.FullName release/release-info.json --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
